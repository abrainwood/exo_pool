name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-test.lock
            requirements-test-sdist.lock

      - name: Install sdist-only test dependencies
        # packages below publish no wheel (sdist only); hash-pinned, no deps
        run: pip install --require-hashes --no-deps -r requirements-test-sdist.lock

      - name: Install test dependencies
        run: pip install --require-hashes --only-binary :all: -r requirements-test.lock

      - name: Run pytest
        run: python -m pytest tests/ -n 4
